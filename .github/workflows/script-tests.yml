# Script tests: runs the repo's node:test fixture suite — and the patch-record
# verifier (map #18: machine-verified records) — on every push. The scripts
# have no other guardrail — this job is the point. Command spelled as
# a shell-expanded glob, not `node --test scripts/`: the directory argument is
# broken on the CI Node 22 line (treated as a module require), while the glob
# works on 22 and 26 alike. The fixtures glob already picks up
# verify-patch-records.test.mjs; the verifier step runs the live records
# (it clones upstream at the pins — needs git + network).
name: script-tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run script tests
        run: node --test scripts/*.test.mjs

      - name: Verify patch records
        # The verifier clones upstream at the pins, so a transient network/TLS
        # hiccup fails a push that touched nothing in patches/. Seen on
        # 2026-10-08: runs failing with 18, 17 and 1 unverifiable records, each
        # passing on retry with no code change. A wrong hunk is deterministic, so
        # retrying keeps the signal and only absorbs the transport noise.
        run: |
          for i in 1 2 3; do
            if node scripts/verify-patch-records.mjs; then exit 0; fi
            echo "verify-patch-records attempt $i failed; retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          exit 1
