# Vendor-sync: shallow-clone upstream skill repos and sync them into the
# per-source directories, skipping PATCHES.md-listed files. Manual trigger only
# (no cron). The script's summary is printed to the step logs.
name: vendor-sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would change without writing any files"
        type: boolean
        required: false
        default: false

jobs:
  sync:
    # Pinned instead of ubuntu-latest: the label migrates to Ubuntu 26.04 from
    # 2026-10-19 (actions/runner-images#14748); this script only needs git + node,
    # so pinning avoids the migration warning and implicit OS churn.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run vendor sync
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/vendor-sync.mjs --dry-run
          else
            node scripts/vendor-sync.mjs
          fi
