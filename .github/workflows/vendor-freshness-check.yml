# Vendor freshness check: runs the vendoring script's dry-run daily and turns
# the result into a pending-update issue the repo owner gets notified about
# (assigned + labeled). Detection only — real repair is manual, via the unified
# skill `my-skills-maintenance` (vendor-sync.yml was dropped at map #18); a
# dry-run never overwrites a patch record (`patches/`). No keepalive: GitHub
# auto-disables scheduled workflows in public repos after
# 60 days without repository activity (commits or manual workflow runs); any
# repository activity (a commit or the workflow's own manual dispatch) resets
# that clock.
name: vendor-freshness-check

on:
  schedule:
    - cron: "0 1 * * *" # daily, UTC 01:00 (~09:00 at UTC+8)
  workflow_dispatch:

permissions:
  contents: read
  issues: write # create/close/label the pending-update issue

jobs:
  check:
    # Same pinning rationale as the dropped vendor-sync.yml: ubuntu-latest
    # migrates OS labels; this job only needs git + node.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Dry-run vendor sync
        # Same transport-noise retry as the script-tests verifier step: the
        # dry-run clones every upstream at its pin, and a transient clone/TLS
        # failure would otherwise redden a daily run for no reason. A genuinely
        # failed source still exits non-zero after the last attempt, so the job
        # fails instead of opening an issue on incomplete data; the log is
        # written once, from the successful attempt.
        run: |
          for i in 1 2 3; do
            if node scripts/vendor-sync.mjs --dry-run > /tmp/vendor-sync.log; then
              cat /tmp/vendor-sync.log
              exit 0
            fi
            echo "vendor-sync dry-run attempt $i failed; retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          exit 1

      # gh needs the token passed explicitly as GH_TOKEN (newer gh CLI in the
      # runner image no longer falls back to the GITHUB_TOKEN env var); env
      # GITHUB_REPOSITORY/GITHUB_RUN_ID come from the runner defaults. Race
      # note: a cron run overlapping a manual dispatch could double-open the
      # issue (the open-issue check is not atomic); accepted — the overlap
      # window is a minute per day.
      - name: Open or close pending-update issue
        run: node scripts/vendor-freshness-check.mjs /tmp/vendor-sync.log
        env:
          GH_TOKEN: ${{ github.token }}

