# npm 发布工作流模板——直接流(Trusted Publisher / OIDC,零 token)
# 用法:复制到 .github/workflows/publish.yml,按 SKILL.md 的"定制点"逐项调整。
# 前置:npmjs.com 已为包配置 Trusted Publisher,绑定本仓库 + 本 workflow 文件名,
# 且其 Allowed actions 允许直接发布(npm publish)。
# 直接流:push v* tag 即经 OIDC 直接 npm publish,无人工 2FA 闸门。
# 需要人工闸门(暂存流)的仓库用 references/workflow-template-staged.yml。
name: publish

on:
  push:
    tags:
      - "v*" # 定制点:仓库 tag 约定(如 "v*" / "release-*")

permissions:
  contents: write # 建占位 Release 需要(gh release create);不需要 Release 步骤可收窄为 read
  id-token: write # Trusted Publishing(OIDC)必需;同时自动生成 provenance

jobs:
  publish:
    runs-on: ubuntu-latest # 定制点:测试依赖 Windows 特性时改 windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # 定制点:Node 24 LTS(npm publish 无 npm 11 门槛)
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci # 定制点:无 package-lock.json 时用 npm install

      - name: Run tests
        # 定制点:无测试可删本步骤;构建脚本需工具路径时在此 step 加 env(如 PI_ESBUILD_DIR)
        run: npm test

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v${tag} does not match package.json version ${version}"
            exit 1
          fi

      # 直接流:OIDC 自动认证并生成 provenance(trusted publishing 下无需
      # --provenance 旗标,显式传入亦无冲突,官方示例即带该旗标)
      - name: Publish to npm registry
        run: npm publish --provenance

      # 可选:建一个占位 Release,避免 tag push 后完全没有 Release 页面。
      # 只生成 "Full Changelog: vX...vY" 一行比较链接,信息量很低——真正分类
      # 整理过的发布说明由 agent 在 SKILL.md 步骤 7 按 write-release-notes skill
      # 撰写后用 `gh release edit` 覆盖,见
      # ../write-release-notes/references/release-notes-guide.md。
      # 不需要 Release 页面的仓库可整段删除(此时 permissions 收窄回 contents: read)。
      - name: Create GitHub Release (placeholder notes)
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}